name: AutoEvolve AI Guardrails

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  guardrails:
    name: AI Coding Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AutoEvolve PR Guardrails
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MAX_ADDED_LINES: "200"
        run: |
          python .github/scripts/check_pr.py
