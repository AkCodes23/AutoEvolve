name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the AutoEvolve self-check
        run: python3 scripts/check.py
      - name: Verify the eval harness runs
        run: python3 evals/run.py --smoke
      - name: Verify the profiler pipeline (offline)
        run: python3 evals/profile.py --selftest
      - name: Run deterministic profiler regression tests
        run: python3 -m unittest discover -s evals -p "test_*.py"
      - name: Validate installer syntax and dry run
        run: |
          sh -n install.sh
          mkdir -p "$RUNNER_TEMP/autoevolve-target"
          ./install.sh --target "$RUNNER_TEMP/autoevolve-target" --dry-run
      - name: Validate agent benchmark CLI
        run: python3 evals/agent_benchmark.py --help
