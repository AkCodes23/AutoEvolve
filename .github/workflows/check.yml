name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the AutoEvolve self-check
        run: python3 scripts/check.py
      - name: Compile every module
        # Without this, a module CI never imports can ship broken.
        run: python3 -m compileall -q scripts autoevolve.py
      - name: Run the mechanism tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Validate every CLI
        run: |
          python3 autoevolve.py --help
          python3 scripts/callers.py --help
          python3 scripts/comments.py --help
          python3 scripts/ruler.py --help
          python3 scripts/corpus_audit.py --help
          python3 scripts/ruler_audit.py --help
          python3 scripts/branch.py --help
          python3 scripts/check_target.py --help
      - name: Exercise the quiet runner on a real command
        # It takes the command as argv (add_help=False), so --help is not a flag here.
        run: python3 scripts/run_quiet.py -- python3 -c "print('ok')"
      - name: The mechanisms must be clean under their own rules
        run: |
          python3 scripts/comments.py --paths $(git ls-files 'scripts/*.py' | tr '\n' ' ') --strict
      - name: Validate installer syntax and dry run
        run: |
          sh -n install.sh
          mkdir -p "$RUNNER_TEMP/autoevolve-target"
          ./install.sh --target "$RUNNER_TEMP/autoevolve-target" --dry-run
      - name: Verify the PowerShell installer parses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { $_.ToString() }
            exit 1
          }
          "install.ps1 parses cleanly"
