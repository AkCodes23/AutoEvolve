name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the AutoEvolve self-check
        run: python3 scripts/check.py
      - name: Compile every module
        # Without this, a module CI never imports can ship broken. agent_loop_sim.py was never
        # imported by any CI step, and that is where a host-execution regression lived.
        run: python3 -m compileall -q evals scripts autoevolve.py
      - name: Verify the eval harness runs
        run: python3 evals/run.py --smoke
      - name: Verify the profiler pipeline (offline)
        run: python3 evals/profile.py --selftest
      - name: Run deterministic profiler regression tests
        run: python3 -m unittest discover -s evals -p "test_*.py"
      - name: Run the mechanism script tests
        # Kept a separate step from the eval tests so a failure names which half broke.
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Validate the mechanism CLIs
        run: |
          python3 scripts/callers.py --help
          python3 scripts/comments.py --help
          python3 scripts/corpus_audit.py --help
      - name: Validate installer syntax and dry run
        run: |
          sh -n install.sh
          mkdir -p "$RUNNER_TEMP/autoevolve-target"
          ./install.sh --target "$RUNNER_TEMP/autoevolve-target" --dry-run
      - name: Validate agent benchmark CLI
        run: python3 evals/agent_benchmark.py --help
      - name: Validate the loop simulator CLI
        run: python3 evals/agent_loop_sim.py --help
      - name: Validate the work report CLI
        run: python3 evals/work_report.py --help
      - name: Validate the task manifest against the scenarios on disk
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          manifest = json.loads((root / "evals" / "manifest.json").read_text(encoding="utf-8"))
          required = {"id", "source", "task", "code_file"}
          problems = []
          for task in manifest["tasks"]:
              missing = required - set(task)
              if missing:
                  problems.append(f"{task.get('id', '?')} missing {sorted(missing)}")
              source = root / task["source"]
              if not source.is_dir():
                  problems.append(f"{task['id']} source does not exist: {task['source']}")
              elif not (source / task["code_file"]).is_file():
                  problems.append(f"{task['id']} code_file missing: {task['code_file']}")
          on_disk = {d.name for d in (root / "evals" / "scenarios").iterdir()
                     if d.is_dir() and not d.name.startswith((".", "__"))}
          covered = {pathlib.Path(t["source"]).name for t in manifest["tasks"]}
          if on_disk - covered:
              problems.append(f"scenarios not in the manifest: {sorted(on_disk - covered)}")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print(f"manifest OK: {len(manifest['tasks'])} tasks covering {len(covered)} scenarios")
          PY
      - name: Verify the PowerShell installer parses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { $_.ToString() }
            exit 1
          }
          "install.ps1 parses cleanly"
